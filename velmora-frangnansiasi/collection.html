            // Group products by brand
            const groupedByBrand = {};
            products.forEach(product => {
                if (!groupedByBrand[product.brand]) {
                    groupedByBrand[product.brand] = [];
                }
                groupedByBrand[product.brand].push(product);
            });

            // Sort brands alphabetically
            const sortedBrands = Object.keys(groupedByBrand).sort();

            const container = document.getElementById('collectionContainer');
            const searchInput = document.getElementById('searchInput');

            // Render all products grouped by brand
            function renderProducts(filterText = '') {
                container.innerHTML = '';
                const filterLower = filterText.toLowerCase().trim();
                let hasResults = false;

                sortedBrands.forEach(brand => {
                    const brandProducts = groupedByBrand[brand];
                    const filteredProducts = filterLower
                        ? brandProducts.filter(p =>
                            p.name.toLowerCase().includes(filterLower) ||
                            brand.toLowerCase().includes(filterLower)
                        )
                        : brandProducts;

                    if (filteredProducts.length > 0) {
                        hasResults = true;
                        const brandSection = document.createElement('div');
                        brandSection.className = 'brand-section';

                        const brandHeader = document.createElement('h2');
                        brandHeader.className = 'brand-header';
                        brandHeader.textContent = brand;
                        brandSection.appendChild(brandHeader);

                        const grid = document.createElement('div');
                        grid.className = 'collection-grid';

                        filteredProducts.forEach(product => {
                            const card = document.createElement('div');
                            card.className = 'product-card';
                            card.onclick = () => openOrderModal(brand, product.name);
                            makeCardAccessible(card);
                            card.innerHTML = `
                                <img src="photo/items/${product.file}" alt="${brand} ${product.name}" class="product-card-img" loading="lazy">
                                <div class="product-info">
                                    <div class="product-brand">${brand}</div>
                                    <div class="product-title">${product.name}</div>
                                    <div class="product-price">
                                        <span class="price-line">
                                            <span class="new-price">$10</span>
                                            <span class="old-price">$12</span>
                                            <span class="size-label">/50 ml</span>
                                        </span>
                                        <span class="price-line">
                                            <span class="new-price">$15</span>
                                            <span class="old-price">$18</span>
                                            <span class="size-label">/100 ml</span>
                                        </span>
                                    </div>
                                    <button class="product-btn">Quick Order</button>
                                </div>
`;
                            grid.appendChild(card);
                        });

                        brandSection.appendChild(grid);
                        container.appendChild(brandSection);
                    }
                });

                if (!hasResults) {
                    container.innerHTML = `
                        <div class="no-results">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <p></p>
                        </div>
                    `;
                    container.querySelector('p').textContent = `No fragrances found matching "${filterText}"`;
                }
            }

            // Search functionality
            searchInput.addEventListener('input', (e) => {
                renderProducts(e.target.value);
            });

            // Initial render
            renderProducts();

            // Position the search bar correctly now that it's in the DOM
            placeSearchBar();
        });
        function placeSearchBar() {
            const search = document.getElementById('searchContainer');
            const headerInner = document.querySelector('.header-inner');
            const backBtn = document.querySelector('.header-right');
            headerInner.insertBefore(search, backBtn); // always in header
        }
    </script>
</body>
</html>
